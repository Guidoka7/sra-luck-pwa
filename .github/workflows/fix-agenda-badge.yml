name: Ajustar badge de orçamento da agenda

on:
  push:
    branches:
      - fix/agenda-badge-orcamento

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ajustar componente
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/admin/PrevisaoLiberacaoFinanceiraInteligente.tsx")
          text = path.read_text(encoding="utf-8")

          old_badges = '''          <div className=\"flex flex-wrap gap-1.5\">\n            <span className=\"rounded-full border border-gold/20 bg-gold/10 px-2.5 py-1 text-[0.58rem] font-semibold text-burgundy\">Valor já liberado no mês: {formatarMoeda(valorJaLiberadoMes)}</span>\n            <span className=\"rounded-full border border-rose/10 bg-[rgb(var(--surface-2))] px-2.5 py-1 text-[0.58rem] font-semibold text-clay/65\">Orçamento: {formatarMoeda(analise?.orcamentoMensal ?? 0)}</span>\n          </div>\n'''
          if text.count(old_badges) != 1:
              raise SystemExit(f"Bloco antigo de badges não encontrado de forma única: {text.count(old_badges)}")
          text = text.replace(old_badges, "", 1)

          marker = '''  const valorRestante = solicitacaoSelecionada ? Number(solicitacaoSelecionada.saldo_restante) : null;\n'''
          addition = '''  const valorRestante = solicitacaoSelecionada ? Number(solicitacaoSelecionada.saldo_restante) : null;\n  const orcamentoAtingido = Boolean(analise?.orcamentoMensal) && valorJaLiberadoMes >= (analise?.orcamentoMensal ?? 0);\n'''
          if text.count(marker) != 1:
              raise SystemExit(f"Ponto de inserção da regra de cor não encontrado de forma única: {text.count(marker)}")
          text = text.replace(marker, addition, 1)

          agenda_marker = '''              </div>\n            </div>\n\n            <div className=\"mx-auto mt-3 w-full max-w-2xl\">\n'''
          agenda_badge = '''              </div>\n            </div>\n\n            <div className=\"mt-3 flex justify-center\">\n              <span className={cn(\"inline-flex items-center rounded-full border px-3 py-1 text-[0.62rem] font-semibold shadow-sm\", orcamentoAtingido ? \"border-burgundy/25 bg-burgundy/8 text-burgundy\" : \"border-success/25 bg-success/8 text-success\")}>\n                Valor já liberado esse mês&nbsp; {formatarMoeda(valorJaLiberadoMes)}/{formatarMoeda(analise.orcamentoMensal)}\n              </span>\n            </div>\n\n            <div className=\"mx-auto mt-3 w-full max-w-2xl\">\n'''
          if text.count(agenda_marker) != 1:
              raise SystemExit(f"Cabeçalho da agenda não encontrado de forma única: {text.count(agenda_marker)}")
          text = text.replace(agenda_marker, agenda_badge, 1)

          path.write_text(text, encoding="utf-8")

      - name: Validar alteração
        run: |
          grep -q 'Valor já liberado esse mês' src/components/admin/PrevisaoLiberacaoFinanceiraInteligente.tsx
          grep -q 'orcamentoAtingido' src/components/admin/PrevisaoLiberacaoFinanceiraInteligente.tsx

      - name: Commitar alteração e remover workflow temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/PrevisaoLiberacaoFinanceiraInteligente.tsx
          git rm .github/workflows/fix-agenda-badge.yml
          git commit -m "fix: compactar indicador de orçamento dentro da agenda"
          git push
