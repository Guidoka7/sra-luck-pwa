name: Remove old agenda release option

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove old release tab from agenda
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/admin/(painel)/agenda/page.tsx')
          text = path.read_text()

          text = text.replace(
              'import { PrevisaoLiberacaoFinanceiraInteligente } from "@/components/admin/PrevisaoLiberacaoFinanceiraInteligente";\n',
              ''
          )
          text = text.replace('type AbaAgenda = "termos" | "liberacao";\n', 'type AbaAgenda = "termos";\n')
          text = text.replace(
              '  const abaInicial = searchParams.get("aba") === "liberacao" ? "liberacao" : "termos";\n',
              '  const abaInicial: AbaAgenda = "termos";\n'
          )
          text = text.replace(
              '  const [agendaLiberacaoBloqueada, setAgendaLiberacaoBloqueada] = useState(false);\n',
              ''
          )

          text = re.sub(
              r'\n  useEffect\(\(\) => \{\n    let ativo = true;\n\n    async function carregarConfiguracoes\(\) \{.*?\n  \}, \[\]\);\n',
              '\n',
              text,
              flags=re.S,
          )

          text = re.sub(
              r'\n        description="Libere datas para os termos cirúrgicos ou acompanhe a previsão de liberação financeira\."',
              '\n        description="Libere datas para os termos cirúrgicos e acompanhe as clientes previstas."',
              text,
          )

          old_tabs = '''      <div className="mx-auto flex w-full max-w-md gap-1 rounded-full bg-blush/70 p-1.5">
        <button
          onClick={() => setAba("termos")}
          className={cn(
            "flex-1 rounded-full px-4 py-2.5 text-xs font-bold uppercase tracking-label transition-all duration-200",
            aba === "termos" ? "bg-burgundy text-cream shadow-card" : "text-burgundy/60 hover:text-burgundy"
          )}
        >
          Termos cirúrgicos
        </button>
        <button
          onClick={() => setAba("liberacao")}
          className={cn(
            "flex-1 rounded-full px-4 py-2.5 text-xs font-bold uppercase tracking-label transition-all duration-200",
            aba === "liberacao" ? "bg-burgundy text-cream shadow-card" : "text-burgundy/60 hover:text-burgundy"
          )}
        >
          Previsão de liberação financeira{agendaLiberacaoBloqueada ? " · bloqueada" : ""}
        </button>
      </div>

      {aba === "liberacao" ? (
        <div className="space-y-6">
          <PrevisaoLiberacaoFinanceiraInteligente />
        </div>
      ) : (
        <>
'''
          new_tabs = '''      <div className="inline-flex w-fit rounded-full bg-blush/70 p-1.5">
        <span className="rounded-full bg-burgundy px-4 py-2.5 text-xs font-bold uppercase tracking-label text-cream shadow-card">
          Termos cirúrgicos
        </span>
      </div>

      <>
'''
          if old_tabs not in text:
              raise SystemExit('Old agenda release tab block not found')
          text = text.replace(old_tabs, new_tabs, 1)

          # The old branch closing `</>` + `)}` becomes a single fragment close.
          text = text.replace('          </div>\n        </>\n      )}\n    </div>\n  );', '          </div>\n      </>\n    </div>\n  );', 1)

          # Keep the page permanently on the terms agenda even if an old URL has ?aba=liberacao.
          text = text.replace('  const [aba, setAba] = useState<AbaAgenda>(abaInicial);\n', '  const [aba] = useState<AbaAgenda>(abaInicial);\n')

          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/admin/(painel)/agenda/page.tsx' '.github/workflows/remove-old-agenda-release-option.yml'
          git commit -m 'fix: remove old financial release option from agenda' || exit 0
          git push
