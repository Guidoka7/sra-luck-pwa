[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Desenvolvimento/homologação: branch deploy de DEVELOP.
# Configure as variáveis de ambiente de homologação no painel da Netlify.
[context.develop]
  command = "npm run build"

# Pull Requests: preview isolado para validação antes do merge.
# Configure as variáveis de ambiente de preview/homologação no painel da Netlify.
[context.deploy-preview]
  command = "npm run build"

# Produção: somente a MAIN deve estar configurada como Production branch na Netlify.
[context.production]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/simulador-iphone-sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/simulador-iphone.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
