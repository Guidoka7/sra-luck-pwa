[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Next.js 14+ usa o runtime OpenNext/Next.js da Netlify automaticamente.
# Não fixamos @netlify/plugin-nextjs aqui para permitir que a Netlify
# mantenha o adapter atualizado e compatível com a versão do Next.js.

[[headers]]
  for = "/simulador-iphone-sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/simulador-iphone.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
