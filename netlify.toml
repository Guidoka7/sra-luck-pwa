[build]
  command = "npm run build"

# O Netlify detecta Next.js automaticamente e usa o Next Runtime
# (@netlify/plugin-nextjs) para rodar SSR, middleware e API routes
# como Netlify Functions/Edge Functions — dentro do plano Free.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/simulador-iphone-sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/simulador-iphone.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
